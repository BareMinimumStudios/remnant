[versions]
# ♻️ standard

# 📦 ~ dependencies
cloche = "0.19.6"
kotlin = "2.4.10"
fabric-language-kotlin = "1.13.13+kotlin.2.4.10"
neoforge-language-kotlin = "2.12.2-k2.4.10-3.0+neoforge"

# 🛟 ~ loaders
fabric-loader = "0.19.3"
neoforge-loader = "21.1.26"

# 📫 version-specific

# 📌 ~ 1.21.1
fabric-api-1211 = "0.116.12"

[plugins]
cloche = { id = "earth.terrarium.cloche", version.ref = "cloche" }

[libraries]
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin" }
neoforge-language-kotlin = { module = "dev.nyon:KotlinLangForge", version.ref = "neoforge-language-kotlin" }
